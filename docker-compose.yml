services:

  mysql:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: "${MYSQL_DATABASE:?Falta MYSQL_DATABASE. Copia .env.example como .env}"
      MYSQL_USER: "${MYSQL_USER:?Falta MYSQL_USER. Copia .env.example como .env}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?Falta MYSQL_PASSWORD. Copia .env.example como .env}"
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?Falta MYSQL_ROOT_PASSWORD. Copia .env.example como .env}"
      TZ: America/Bogota

    ports:
      - "${MYSQL_PORT:-3307}:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/reference/db.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s


  citas-api-dev:
    image: maven:3.9-eclipse-temurin-21
    restart: unless-stopped

    working_dir: /workspace

    volumes:
      - ./citas-api:/workspace
      - maven_cache:/root/.m2

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: "${MYSQL_DATABASE:?Falta MYSQL_DATABASE. Copia .env.example como .env}"
      DB_USER: "${MYSQL_USER:?Falta MYSQL_USER. Copia .env.example como .env}"
      DB_PASSWORD: "${MYSQL_PASSWORD:?Falta MYSQL_PASSWORD. Copia .env.example como .env}"

      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?Falta JWT_ACCESS_SECRET. Copia .env.example como .env}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?Falta JWT_REFRESH_SECRET. Copia .env.example como .env}"

    ports:
      - "${API_PORT:-8080}:8080"

    depends_on:
      mysql:
        condition: service_healthy

    command:
      - bash
      - -lc
      - tail -f /dev/null


  citas-web-dev:
    image: node:24-alpine
    restart: unless-stopped

    working_dir: /workspace

    volumes:
      - ./citas-web:/workspace
      - node_cache:/root/.npm

    ports:
      - "${REACT_PORT:-5173}:5173"
      - "${ANGULAR_PORT:-4200}:4200"

    depends_on:
      - citas-api-dev

    command:
      - sh
      - -lc
      - tail -f /dev/null


volumes:
  mysql_data:
  maven_cache:
  node_cache:
